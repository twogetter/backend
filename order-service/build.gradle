apply plugin: 'org.springframework.boot'
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/bubbletea/order/OrderServiceApplication*',
                'com/bubbletea/order/**/config/**',
                'com/bubbletea/order/**/dto/**',
            ])
        }))
    }
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation project(':common-lib')

    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Storage
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // feignClient
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // Swagger / OpenAPI (Spring Boot 4 호환)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    runtimeOnly 'org.postgresql:postgresql'

    // ── 통합 테스트 ──
    // 공용 Testcontainers(Postgres·Kafka) + IntegrationTestBase
    testImplementation project(':common-test')
    // 외부 서비스(user/product) Feign 호출 스텁. payment-service 와 동일 버전 사용.
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
    // Spring Boot 4 에서 MockMvc 자동설정(@AutoConfigureMockMvc)이 별도 모듈로 분리됨
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
}

tasks.register("prepareKotlinBuildScriptModel"){}