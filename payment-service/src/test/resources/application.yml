CONFIG_SERVER_IMPORT: ""

spring:
  profiles:
    active: test
  config:
    import: "optional:configserver:"
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

toss:
  payments:
    client-key: test-client-key
    widget-secret-key: test-widget-secret
    api-secret-key: test-api-secret
    redirect-url: http://localhost/test
    base-url: ""
