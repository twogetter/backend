spring:
  application:
    name: chat-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8600,http://localhost:8000"

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000


