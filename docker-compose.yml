name: bubbletea

networks:
  bubbletea-net:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:

services:

  postgres:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ bubbletea-net ]

  mongodb:
    image: mongo:8
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --host localhost --port 27017 -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ bubbletea-net ]

  mongo-init:
    image: mongo:8
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - ./docker/mongo-init:/scripts
    command: >
      mongosh --host mongodb --port 27017
      -u ${MONGO_ROOT_USERNAME} -p ${MONGO_ROOT_PASSWORD}
      --authenticationDatabase admin
      /scripts/init.js
    restart: "no"
    networks: [ bubbletea-net ]

  mongo-seed:
    image: mongo:8
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    environment:
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - ./docker/mongo-seed:/scripts
    command: >
      mongosh --host mongodb --port 27017
      -u product_user -p ${MONGO_APP_PASSWORD}
      --authenticationDatabase productdb
      /scripts/init-local-data.js
    restart: "no"
    networks: [ bubbletea-net ]
    profiles: [ "local" ]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ bubbletea-net ]

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: bubbletea-kafka
    ports:
      - "9092:9092"    # 호스트(PC)에서 접근하는 포트
      - "9094:9094"    # 컨테이너 내부 전용 리스너
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://bubbletea-kafka:9094,HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ bubbletea-net ]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bubbletea-kafka-ui
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bubbletea-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: bubbletea-kafka:9094
    depends_on:
      kafka: { condition: service_healthy }
    networks: [ bubbletea-net ]

  config-server:
    build: {
      context: .,
      dockerfile: config-server/Dockerfile
    }
    container_name: config-server
    ports:
      - "8888:8888"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ bubbletea-net ]

  eureka-server:
    build: {
      context: .,
      dockerfile: eureka-server/Dockerfile
    }
    container_name: eureka-server
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      EUREKA_HOSTNAME: eureka-server
      EUREKA_URL: http://eureka-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "8761:8761"
    networks: [ bubbletea-net ]

  api-gateway:
    build: {
      context: .,
      dockerfile: gateway-server/Dockerfile
    }
    container_name: gateway-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    networks: [ bubbletea-net ]

  auth-service:
    build: {
      context: .,
      dockerfile: auth-service/Dockerfile
    }
    container_name: auth-service
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8081:8081"

    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

    networks:
      - bubbletea-net

  user-service:
    build: {
      context: .,
      dockerfile: user-service/Dockerfile
    }
    container_name: user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports: [ "8100:8100" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      postgres:      { condition: service_healthy }
    networks: [ bubbletea-net ]

  product-service:
    build: {
      context: .,
      dockerfile: product-service/Dockerfile
    }
    container_name: product-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports: [ "8200:8200" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      mongodb:       { condition: service_healthy }
    networks: [ bubbletea-net ]

  payment-service:
    build: {
      context: .,
      dockerfile: payment-service/Dockerfile
    }
    container_name: payment-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports: [ "8300:8300" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
    networks:
      - bubbletea-net

  order-service:
    build: {
      context: .,
      dockerfile: order-service/Dockerfile
    }
    container_name: order-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports: [ "8400:8400" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      postgres:      { condition: service_healthy }
    networks:
      - bubbletea-net

  notification-service:
    build: {
      context: .,
      dockerfile: notification-service/Dockerfile
    }
    container_name: notification-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports: [ "8500:8500" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      postgres:      { condition: service_healthy }
    networks: [ bubbletea-net ]

  chat-service:
    build: {
      context: .,
      dockerfile: chat-service/Dockerfile
    }
    container_name: chat-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports: [ "8600:8600" ]
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
    networks: [ bubbletea-net ]


